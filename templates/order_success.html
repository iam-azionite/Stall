<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Order Success</title>
    <style>
        :root {
            --ink: #1c1b1a;
            --paper: #faf9f7;
            --line: #d8d5cf;
            --accent: #2f5d50;
            --muted: #6b6862;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--paper);
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
            color: var(--ink);
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: #fff;
            padding: 36px 32px;
        }

        .badge {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0 0 4px;
            font-size: 1.3rem;
            font-weight: 600;
        }

        .order-id {
            margin: 0 0 24px;
            font-size: 0.85rem;
            color: var(--muted);
        }

        .items {
            border-top: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
            padding: 12px 0;
            margin-bottom: 16px;
        }

        .line {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            padding: 6px 0;
        }

        .line .name { flex: 1; }
        .line .qty { color: var(--muted); }

        .total {
            display: flex;
            justify-content: space-between;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 24px;
        }

        .confirm {
            font-size: 0.9rem;
            color: var(--muted);
            margin: 0;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="badge">&check;</div>
    <h1>Order placed</h1>
    <p class="order-id">Order #{{ order.id }}</p>

    <div class="items">
        {% for item in order_items %}
        <div class="line">
            <span class="name">{{ item.product.name }}</span>
            <span class="qty">&times;{{ item.quantity }}</span>
        </div>
        {% endfor %}
    </div>

    <div class="total">
        <span>Total</span>
        <span>{{ order.total }}</span>
    </div>

    <p class="confirm">Your order has been placed. You'll be notified when it ships.</p>
</div>
</body>
</html>
