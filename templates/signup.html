<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Account</title>
    <style>
        :root {
            --ink: #1c1b1a;
            --paper: #faf9f7;
            --line: #d8d5cf;
            --accent: #2f5d50;
            --accent-hover: #244a40;
            --error: #b3423a;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--paper);
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
            color: var(--ink);
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 360px;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 40px 32px;
            background: #fff;
        }

        h1 {
            margin: 0 0 28px;
            font-size: 1.5rem;
            font-weight: 600;
        }

        form p {
            margin: 0 0 18px;
            display: flex;
            flex-direction: column;
        }

        form label {
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 6px;
        }

        form input,
        form select,
        form textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 4px;
            font-size: 1rem;
            background: var(--paper);
            color: var(--ink);
            font-family: inherit;
        }

        form input:focus,
        form select:focus,
        form textarea:focus {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
            border-color: var(--accent);
        }

        .errorlist {
            list-style: none;
            padding: 0;
            margin: 0 0 6px;
            font-size: 0.82rem;
            color: var(--error);
        }

        button {
            width: 100%;
            margin-top: 8px;
            padding: 11px;
            border: none;
            border-radius: 4px;
            background: var(--accent);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover { background: var(--accent-hover); }

        .alt-action {
            display: block;
            margin-top: 20px;
            text-align: center;
            font-size: 0.9rem;
            color: var(--accent);
            text-decoration: none;
        }

        .alt-action:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="card">
    <h1>Create account</h1>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Create account</button>
    </form>
    <a class="alt-action" href="{% url 'login' %}">Already have an account? Log in</a>
</div>
</body>
</html>
