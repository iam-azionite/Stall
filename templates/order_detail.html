<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Order Detail</title>
    <style>
        :root {
            --ink: #1c1b1a;
            --paper: #faf9f7;
            --line: #d8d5cf;
            --accent: #2f5d50;
            --muted: #6b6862;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--paper);
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
            color: var(--ink);
        }

        main {
            max-width: 480px;
            margin: 0 auto;
            padding: 32px;
        }

        h1 {
            margin: 0 0 24px;
            font-size: 1.6rem;
            font-weight: 600;
        }

        .items {
            border: 1px solid var(--line);
            border-radius: 6px;
            background: #fff;
            padding: 20px;
            margin-bottom: 20px;
        }

        .line {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            font-size: 0.9rem;
            padding: 8px 0;
            border-bottom: 1px solid var(--line);
        }

        .line:last-of-type { border-bottom: none; }

        .line .name { flex: 1; color: var(--ink); }
        .line .qty { color: var(--muted); }
        .line .price { color: var(--muted); }

        .total {
            display: flex;
            justify-content: space-between;
            padding-top: 14px;
            margin-top: 6px;
            border-top: 1px solid var(--line);
            font-size: 1rem;
            font-weight: 600;
        }

        .back {
            display: inline-block;
            font-size: 0.9rem;
            color: var(--muted);
            text-decoration: none;
        }

        .back:hover { color: var(--accent); }
    </style>
</head>
<body>
<main>
    <h1>Order detail</h1>

    <div class="items">
        {% for item in order_items %}
        <div class="line">
            <span class="name">{{ item.product.name }}</span>
            <span class="qty">&times;{{ item.quantity }}</span>
            <span class="price">{{ item.price }}</span>
        </div>
        {% endfor %}
        <div class="total">
            <span>Total</span>
            <span>{{ order.total }}</span>
        </div>
    </div>

    <a class="back" href="{% url 'my_orders' %}">&larr; Back to orders</a>
</main>
</body>
</html>
